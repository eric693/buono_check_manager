<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#4169E1">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="出勤管家">
    <title data-i18n="MANUAL_TITLE">使用手冊 - 出勤管家</title>
    <link rel="icon" href="0rigin.svg" type="image/x-icon">

    <style>
        /* 手冊是拿來讀與列印的，所以不套主系統的深色主題，維持高對比的淺色版面 */
        :root {
            --ink: #1f2937;
            --muted: #6b7280;
            --accent: #4338ca;
            --accent-soft: #eef2ff;
            --line: #e5e7eb;
            --bg: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
            line-height: 1.8;
        }

        .manual-header {
            border-bottom: 1px solid var(--line);
            padding: 20px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .manual-header h1 {
            margin: 0;
            font-size: 1.35rem;
        }

        .manual-header .sub {
            color: var(--muted);
            font-size: 0.875rem;
            width: 100%;
            margin: 0;
        }

        .header-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            border-radius: 8px;
            padding: 7px 14px;
            font: inherit;
            font-size: 0.875rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover { background: #f9fafb; }

        select.btn { padding-right: 8px; }

        .layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 32px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .toc {
            position: sticky;
            top: 24px;
            align-self: start;
            max-height: calc(100vh - 48px);
            overflow-y: auto;
            font-size: 0.9rem;
        }

        .toc h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            margin: 0 0 10px;
        }

        .toc .group-label {
            font-weight: 700;
            margin: 14px 0 4px;
            color: var(--ink);
        }

        .toc a {
            display: block;
            padding: 3px 0 3px 10px;
            color: var(--muted);
            text-decoration: none;
            border-left: 2px solid transparent;
        }

        .toc a:hover { color: var(--accent); border-left-color: var(--accent); }

        .group-title {
            font-size: 1.1rem;
            margin: 40px 0 8px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent-soft);
            color: var(--accent);
        }

        .group-title:first-child { margin-top: 0; }

        .section {
            /* 列印時盡量不要把一個功能切到兩頁 */
            break-inside: avoid;
            margin-bottom: 28px;
        }

        .section h3 {
            font-size: 1rem;
            margin: 0 0 6px;
        }

        .section .intro {
            margin: 0 0 10px;
            color: var(--ink);
        }

        .section .label {
            font-weight: 600;
            color: var(--accent);
            margin: 12px 0 4px;
            font-size: 0.9rem;
        }

        .section ol, .section ul { margin: 0; padding-left: 22px; }
        .section li { margin-bottom: 4px; }
        .section dl { margin: 0; }
        .section dt { font-weight: 600; }
        .section dd { margin: 0 0 6px; color: var(--muted); }

        .loading { color: var(--muted); padding: 40px 0; }

        @media (max-width: 820px) {
            .layout { grid-template-columns: 1fr; gap: 16px; padding: 16px; }
            .toc { position: static; max-height: none; }
        }

        @media print {
            .manual-header .header-actions, .toc { display: none; }
            .layout { display: block; max-width: none; padding: 0; }
            body { line-height: 1.6; }
            a { color: inherit; text-decoration: none; }
        }
    </style>
</head>
<body>
    <header class="manual-header">
        <h1 data-i18n="MANUAL_TITLE">使用手冊</h1>
        <div class="header-actions">
            <select id="language-switcher" class="btn">
                <option value="zh-TW">繁體中文</option>
                <option value="en-US">English</option>
                <option value="id">Bahasa Indonesia</option>
                <option value="vi">Tiếng Việt</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="th">ภาษาไทย</option>
            </select>
            <button type="button" class="btn" id="manual-print-btn" data-i18n="MANUAL_PRINT">列印</button>
            <a class="btn" href="./" data-i18n="MANUAL_BACK">返回系統</a>
        </div>
        <p class="sub" data-i18n="MANUAL_SUBTITLE">本手冊由系統內各功能頁的「操作說明」自動彙整，內容與畫面上看到的一致。</p>
    </header>

    <div class="layout">
        <nav class="toc">
            <h2 data-i18n="MANUAL_TOC">目錄</h2>
            <div id="manual-toc"></div>
        </nav>
        <main id="manual-content">
            <p class="loading" data-i18n="LOADING">載入中...</p>
        </main>
    </div>

    <script>
        // i18n.js 預設用 APP_TITLE 當頁面標題，這頁要用手冊自己的標題
        window.I18N_TITLE_KEY = 'MANUAL_TITLE';
    </script>
    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <script src="manual.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
