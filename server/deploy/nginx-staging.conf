# 測試區：前端與後端放在同一個網域
#   /exec、/files、/healthz → 後端（127.0.0.1:8041）
#   /config.js              → 測試區專用設定（API 指向同網域的 /exec）
#   其他                     → 前端靜態檔（staging branch 的 clone）
#
# 安裝：
#   cp server/deploy/nginx-staging.conf /etc/nginx/sites-available/buono-staging.crownai.ink
#   ln -s /etc/nginx/sites-available/buono-staging.crownai.ink /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d buono-staging.crownai.ink
server {
    listen 80;
    server_name buono-staging.crownai.ink;

    client_max_body_size 12M;
    root /root/project/buono/deploy/staging;

    # 測試區的標示，搜尋引擎不要收錄
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ ^/(exec|files/|healthz) {
        proxy_pass         http://127.0.0.1:8041;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /config.js {
        alias /root/project/buono/deploy/staging/server/deploy/staging-config.js;
        add_header Cache-Control "no-store";
    }

    # 只開放前端需要的檔案，不要把 repo 裡的 server/、GS/、.git 送出去
    location ~ ^/(server|GS|tools|node_modules|\.git) { return 404; }
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
